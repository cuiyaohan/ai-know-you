<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="ui-sans-serif,system-ui,Segoe UI,Roboto,Arial">
  <rect width="920" height="360" fill="#FFFFFF"/>
  <text x="40" y="42" fill="#0F172A" font-size="22" font-weight="700">Layered profile model</text>
  <text x="40" y="66" fill="#64748B" font-size="14">Three independent layers evolve on their own cadence instead of one undifferentiated blob.</text>

  <!-- Facts -->
  <rect x="120" y="96" width="760" height="64" rx="12" fill="#4F46E5"/>
  <rect x="140" y="116" width="24" height="24" rx="6" fill="#FFFFFF" opacity="0.25"/>
  <text x="180" y="122" fill="#FFFFFF" font-size="18" font-weight="600">Facts</text>
  <text x="180" y="146" fill="#E0E7FF" font-size="14">who you are / what you are doing — stable-ish, slow-moving</text>

  <!-- Preferences -->
  <rect x="120" y="176" width="760" height="64" rx="12" fill="#0EA5E9"/>
  <circle cx="152" cy="208" r="12" fill="#FFFFFF" opacity="0.3"/>
  <text x="180" y="202" fill="#FFFFFF" font-size="18" font-weight="600">Preferences</text>
  <text x="180" y="226" fill="#E0F2FE" font-size="14">how you like to work and communicate — evolves with feedback</text>

  <!-- Boundaries -->
  <rect x="120" y="256" width="760" height="64" rx="12" fill="#EF4444"/>
  <path d="M140 288 l16 -16 16 16 16 -16 16 16" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.4"/>
  <text x="180" y="282" fill="#FFFFFF" font-size="18" font-weight="600">Boundaries</text>
  <text x="180" y="306" fill="#FEE2E2" font-size="14">red lines, no-go zones, hard constraints — rarely changes</text>
</svg>
