<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ai-know-you logo">
  <title>ai-know-you</title>
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="240" height="240" rx="52" ry="52"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="240" height="240" fill="#0F172A"/>

    <!-- two overlapping discs: agent (indigo) ∩ you (teal) = understanding -->
    <circle cx="100" cy="120" r="62" fill="#4F46E5"/>
    <circle cx="140" cy="120" r="62" fill="#0EA5E9"/>
    <!-- overlap highlight -->
    <path d="M 100 58 A 62 62 0 0 1 140 58 A 62 62 0 0 0 100 182 A 62 62 0 0 1 140 182 A 62 62 0 0 0 100 58 Z" fill="#7DD3FC" opacity="0.55"/>

    <!-- connecting node -->
    <circle cx="120" cy="120" r="13" fill="#F8FAFC"/>
    <circle cx="120" cy="120" r="5" fill="#0F172A"/>

    <!-- subtle baseline -->
    <rect x="0" y="208" width="240" height="32" fill="#111827"/>
    <text x="120" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#E2E8F0">ai-know-you</text>
  </g>

  <rect x="1" y="1" width="238" height="238" rx="51" ry="51" fill="none" stroke="#1E293B" stroke-width="2"/>
</svg>
